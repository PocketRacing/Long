<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>СЕВЕР — Выживание</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#071015;
    color:#e8e7df;
    font-family:Arial,Helvetica,sans-serif;
}

button{
    font:inherit;
    color:inherit;
}

#game{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
}

/* =========================================================
   MAP
========================================================= */

#mapScreen{
    position:absolute;
    inset:0;
    background:#111;
    overflow:hidden;
}

#world{
    position:absolute;
    left:50%;
    top:50%;
    width:1600px;
    height:1067px;

    background-image:url("картинки/карта_местности.PNG");
    background-size:100% 100%;
    background-repeat:no-repeat;

    transform:translate(-50%,-50%);
    transform-origin:center;
    transition:transform .12s linear;
    filter:saturate(.72) contrast(1.05);
}

/* лёгкое затемнение карты */
#mapScreen:after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(circle at center,
            transparent 35%,
            rgba(0,0,0,.15) 65%,
            rgba(0,0,0,.58) 100%);
}

/* координаты игрока */
#player{
    position:absolute;
    left:50%;
    top:50%;
    width:28px;
    height:28px;
    margin:-14px 0 0 -14px;
    z-index:20;
}

.playerDot{
    width:28px;
    height:28px;
    border-radius:50%;
    border:2px solid white;
    background:#bfad73;
    box-shadow:
        0 0 0 6px rgba(190,175,115,.15),
        0 0 20px rgba(255,255,255,.45);
}

.playerArrow{
    position:absolute;
    left:50%;
    top:-22px;
    transform:translateX(-50%);
    font-size:16px;
}

/* =========================================================
   TOP HUD
========================================================= */

#topHud{
    position:absolute;
    left:0;
    right:0;
    top:0;
    z-index:50;
    padding:12px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    pointer-events:none;
}

.hudBox{
    background:rgba(5,10,13,.83);
    border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(8px);
    box-shadow:0 5px 20px rgba(0,0,0,.35);
    padding:9px 12px;
}

#locationName{
    font-size:17px;
    font-weight:bold;
    letter-spacing:.5px;
}

#locationSub{
    color:#9ea7a6;
    font-size:11px;
    margin-top:3px;
}

#clock{
    text-align:right;
    font-size:16px;
}

#weatherText{
    font-size:11px;
    color:#aeb8b6;
    margin-top:3px;
}

/* =========================================================
   STATUS
========================================================= */

#status{
    position:absolute;
    z-index:55;
    top:82px;
    right:12px;
    width:170px;
    background:rgba(5,10,13,.82);
    border:1px solid rgba(255,255,255,.13);
    padding:9px;
}

.stat{
    margin-bottom:7px;
}

.stat:last-child{
    margin-bottom:0;
}

.statLine{
    display:flex;
    justify-content:space-between;
    font-size:10px;
    color:#aeb6b4;
    margin-bottom:3px;
}

.bar{
    height:5px;
    background:#263035;
    overflow:hidden;
}

.bar i{
    display:block;
    height:100%;
    width:100%;
    background:#c4b47b;
}

/* =========================================================
   MAP CONTROLS
========================================================= */

#controls{
    position:absolute;
    z-index:70;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    display:grid;
    grid-template-columns:60px 60px 60px;
    grid-template-rows:60px 60px;
    gap:7px;
}

.move{
    border:1px solid rgba(255,255,255,.25);
    background:rgba(7,13,16,.82);
    font-size:27px;
    cursor:pointer;
    user-select:none;
    box-shadow:0 5px 20px rgba(0,0,0,.3);
}

.move:active{
    background:#374047;
    transform:scale(.94);
}

.up{grid-column:2}
.left{grid-column:1;grid-row:2}
.down{grid-column:2;grid-row:2}
.right{grid-column:3;grid-row:2}

/* =========================================================
   ACTION BUTTONS
========================================================= */

#actions{
    position:absolute;
    z-index:60;
    left:12px;
    bottom:18px;
    display:flex;
    gap:7px;
}

.action{
    min-width:52px;
    height:52px;
    border:1px solid rgba(255,255,255,.17);
    background:rgba(5,10,13,.84);
    cursor:pointer;
}

.action span{
    display:block;
    font-size:20px;
}

.action small{
    font-size:9px;
    color:#aab1ae;
}

/* =========================================================
   MAP MARKERS
========================================================= */

.marker{
    position:absolute;
    z-index:10;
    transform:translate(-50%,-50%);
    width:36px;
    height:36px;
    border-radius:50%;
    background:rgba(8,14,17,.8);
    border:1px solid rgba(255,255,255,.25);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    cursor:pointer;
}

.marker:hover{
    background:#384047;
}

.markerLabel{
    position:absolute;
    top:37px;
    white-space:nowrap;
    font-size:9px;
    color:#eee;
    text-shadow:0 2px 4px #000;
}

/* =========================================================
   PANELS / MODALS
========================================================= */

.overlay{
    position:absolute;
    inset:0;
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.66);
    backdrop-filter:blur(5px);
}

.overlay.open{
    display:flex;
}

.panel{
    width:min(720px,94vw);
    max-height:90vh;
    overflow:auto;
    background:#10171a;
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 20px 70px rgba(0,0,0,.65);
}

.panelHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px;
    border-bottom:1px solid rgba(255,255,255,.1);
}

.panelHeader h2{
    margin:0;
    font-size:18px;
}

.close{
    width:35px;
    height:35px;
    border:0;
    background:#252d31;
    cursor:pointer;
}

.panelBody{
    padding:15px;
}

/* =========================================================
   INVENTORY
========================================================= */

.inventoryGrid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.item{
    min-height:82px;
    background:#192125;
    border:1px solid rgba(255,255,255,.08);
    padding:8px;
    cursor:pointer;
}

.item:hover{
    border-color:#aaa;
}

.itemIcon{
    font-size:28px;
}

.itemName{
    font-size:10px;
    margin-top:5px;
}

.itemCount{
    color:#9fa8a6;
    font-size:9px;
}

/* =========================================================
   INTERIOR
========================================================= */

#interiorScreen{
    position:absolute;
    inset:0;
    z-index:150;
    display:none;
    background:
        radial-gradient(circle at 50% 25%,
            rgba(190,160,105,.17),
            transparent 30%),
        linear-gradient(
            180deg,
            #242b2d 0%,
            #171d1f 55%,
            #0d1214 100%);
}

#interiorScreen.open{
    display:block;
}

.room{
    position:absolute;
    inset:0;
}

/* стены */
.wall{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:43%;
    background:
        linear-gradient(90deg,
            rgba(0,0,0,.3),
            transparent,
            rgba(0,0,0,.4)),
        repeating-linear-gradient(
            90deg,
            #343a39 0,
            #343a39 70px,
            #303634 71px,
            #303634 140px);
    border-bottom:4px solid #161a1a;
}

/* пол */
.floor{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:59%;
    background:
        repeating-linear-gradient(
            8deg,
            #292b29 0,
            #292b29 45px,
            #222523 46px,
            #222523 90px);
    transform:perspective(500px) rotateX(18deg);
    transform-origin:bottom;
}

/* предметы комнаты */
.roomObject{
    position:absolute;
    z-index:5;
    border:1px solid rgba(255,255,255,.12);
    cursor:pointer;
    transition:.15s;
}

.roomObject:hover{
    filter:brightness(1.3);
}

.table{
    width:250px;
    height:110px;
    left:50%;
    top:58%;
    transform:translate(-50%,-50%);
    background:#4a3828;
    box-shadow:0 25px 20px rgba(0,0,0,.4);
}

.bed{
    width:270px;
    height:90px;
    left:14%;
    top:57%;
    background:#39474a;
    box-shadow:0 20px 20px rgba(0,0,0,.5);
}

.stove{
    width:100px;
    height:130px;
    right:14%;
    top:42%;
    background:#292b2a;
    box-shadow:0 15px 20px #000;
}

.chest{
    width:120px;
    height:75px;
    left:62%;
    top:68%;
    background:#59432d;
}

.eye{
    position:absolute;
    left:50%;
    top:-28px;
    transform:translateX(-50%);
    width:34px;
    height:34px;
    border-radius:50%;
    background:rgba(0,0,0,.72);
    border:1px solid rgba(255,255,255,.35);
    display:flex;
    align-items:center;
    justify-content:center;
}

/* =========================================================
   COMBAT
========================================================= */

#combatScreen{
    position:absolute;
    inset:0;
    z-index:500;
    display:none;
    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(130,130,110,.2),
            transparent 32%),
        linear-gradient(
            180deg,
            #151a1a,
            #090d0f 70%);
}

#combatScreen.open{
    display:block;
}

.combatTop{
    position:absolute;
    top:15px;
    left:15px;
    right:15px;
    display:flex;
    justify-content:space-between;
}

.enemyTitle{
    font-size:20px;
    font-weight:bold;
}

.distance{
    color:#adb4b1;
    font-size:12px;
    margin-top:4px;
}

.enemy{
    position:absolute;
    left:50%;
    top:44%;
    transform:translate(-50%,-50%);
    text-align:center;
}

.animal{
    font-size:130px;
    filter:drop-shadow(0 20px 15px rgba(0,0,0,.6));
}

.enemyHealth{
    width:250px;
    height:8px;
    background:#342b2b;
    margin:10px auto;
}

.enemyHealth i{
    display:block;
    height:100%;
    background:#9b4e48;
}

.combatBottom{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    padding:14px;
    background:rgba(5,9,11,.92);
    border-top:1px solid rgba(255,255,255,.1);
}

.combatStats{
    display:flex;
    justify-content:center;
    gap:25px;
    font-size:12px;
    margin-bottom:12px;
}

.combatButtons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    max-width:700px;
    margin:auto;
}

.combatBtn{
    min-height:58px;
    background:#20282c;
    border:1px solid rgba(255,255,255,.13);
    cursor:pointer;
}

.combatBtn:active{
    background:#4a5050;
}

/* =========================================================
   NOTIFICATION
========================================================= */

#notification{
    position:absolute;
    z-index:1000;
    left:50%;
    top:16%;
    transform:translateX(-50%);
    padding:12px 18px;
    background:rgba(4,9,11,.92);
    border:1px solid rgba(255,255,255,.18);
    opacity:0;
    pointer-events:none;
    transition:.25s;
    text-align:center;
}

#notification.show{
    opacity:1;
}

/* =========================================================
   EVENT
========================================================= */

.eventTitle{
    font-size:22px;
    margin-bottom:7px;
}

.eventText{
    color:#b3bbb8;
    line-height:1.5;
}

.eventButtons{
    display:flex;
    gap:7px;
    margin-top:18px;
}

.eventButtons button{
    flex:1;
    padding:13px;
    background:#222b2f;
    border:1px solid rgba(255,255,255,.15);
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    #world{
        width:1250px;
        height:834px;
    }

    #status{
        top:75px;
        width:145px;
    }

    #actions{
        left:8px;
        bottom:8px;
    }

    .action{
        width:48px;
        min-width:48px;
        height:48px;
    }

    #controls{
        bottom:8px;
        grid-template-columns:54px 54px 54px;
        grid-template-rows:54px 54px;
    }

    .move{
        font-size:23px;
    }

    .inventoryGrid{
        grid-template-columns:repeat(3,1fr);
    }

    .animal{
        font-size:95px;
    }

    .combatButtons{
        grid-template-columns:repeat(2,1fr);
    }
}
</style>
</head>

<body>

<div id="game">

<!-- ======================================================
     КАРТА
======================================================= -->

<div id="mapScreen">

    <div id="world">

        <!-- маркеры -->
        <div class="marker" style="left:43%;top:45%" onclick="enterLocation('Таинственное озеро','Хижина рыбака')">
            🏠
            <div class="markerLabel">Хижина рыбака</div>
        </div>

        <div class="marker" style="left:51%;top:61%" onclick="enterLocation('Горный город','Дом')">
            🏠
            <div class="markerLabel">Дом</div>
        </div>

        <div class="marker" style="left:31%;top:62%" onclick="enterLocation('Мрачная бухта','Причал')">
            ⚓
            <div class="markerLabel">Причал</div>
        </div>

        <div class="marker" style="left:71%;top:30%" onclick="showEvent('Заброшенное здание')">
            🏚
            <div class="markerLabel">Здание</div>
        </div>

        <div class="marker" style="left:68%;top:71%" onclick="showEvent('Лагерь')">
            🔥
            <div class="markerLabel">Лагерь</div>
        </div>

        <div class="marker" style="left:78%;top:65%" onclick="showEvent('Пещера')">
            ⛰
            <div class="markerLabel">Пещера</div>
        </div>

    </div>

    <div id="player">
        <div class="playerArrow">▲</div>
        <div class="playerDot"></div>
    </div>

    <!-- HUD -->

    <div id="topHud">

        <div class="hudBox">
            <div id="locationName">ТАИНСТВЕННОЕ ОЗЕРО</div>
            <div id="locationSub">Окрестности</div>
        </div>

        <div class="hudBox">
            <div id="clock">08:00</div>
            <div id="weatherText">Ясно · −8°C</div>
        </div>

    </div>

    <!-- состояние -->

    <div id="status">

        <div class="stat">
            <div class="statLine">
                <span>Состояние</span>
                <b id="hpText">100</b>
            </div>
            <div class="bar"><i id="hpBar"></i></div>
        </div>

        <div class="stat">
            <div class="statLine">
                <span>Голод</span>
                <b id="foodText">100</b>
            </div>
            <div class="bar"><i id="foodBar"></i></div>
        </div>

        <div class="stat">
            <div class="statLine">
                <span>Жажда</span>
                <b id="waterText">100</b>
            </div>
            <div class="bar"><i id="waterBar"></i></div>
        </div>

        <div class="stat">
            <div class="statLine">
                <span>Усталость</span>
                <b id="energyText">100</b>
            </div>
            <div class="bar"><i id="energyBar"></i></div>
        </div>

        <div class="stat">
            <div class="statLine">
                <span>Тепло</span>
                <b id="warmText">100</b>
            </div>
            <div class="bar"><i id="warmBar"></i></div>
        </div>

    </div>

    <!-- действия -->

    <div id="actions">

        <button class="action" onclick="openInventory()">
            <span>🎒</span>
            <small>РЮКЗАК</small>
        </button>

        <button class="action" onclick="openMapInfo()">
            <span>🗺</span>
            <small>КАРТА</small>
        </button>

        <button class="action" onclick="openJournal()">
            <span>📓</span>
            <small>ЖУРНАЛ</small>
        </button>

    </div>

    <!-- управление -->

    <div id="controls">

        <button class="move up" onclick="move(0,-1)">▲</button>
        <button class="move left" onclick="move(-1,0)">◀</button>
        <button class="move down" onclick="move(0,1)">▼</button>
        <button class="move right" onclick="move(1,0)">▶</button>

    </div>

</div>


<!-- ======================================================
     ИНТЕРЬЕР
======================================================= -->

<div id="interiorScreen">

    <div class="room">

        <div class="wall"></div>
        <div class="floor"></div>

        <div class="roomObject bed"
             onclick="inspect('Кровать','Старая, но ещё пригодная для сна.')">
            <div class="eye">◉</div>
        </div>

        <div class="roomObject table"
             onclick="openContainer('Тумбочка')">
            <div class="eye">◉</div>
        </div>

        <div class="roomObject stove"
             onclick="inspect('Печь','Можно развести огонь.')">
            <div class="eye">◉</div>
        </div>

        <div class="roomObject chest"
             onclick="openContainer('Сундук')">
            <div class="eye">◉</div>
        </div>

    </div>

    <button
        onclick="exitLocation()"
        style="
        position:absolute;
        top:15px;
        left:15px;
        z-index:30;
        padding:12px 18px;
        background:rgba(5,10,13,.88);
        border:1px solid rgba(255,255,255,.2);
        ">
        ← ВЫЙТИ
    </button>

    <div style="
        position:absolute;
        bottom:18px;
        left:50%;
        transform:translateX(-50%);
        background:rgba(5,10,13,.85);
        padding:10px 18px;
        font-size:12px;">
        ХИЖИНА РЫБАКА
    </div>

</div>


<!-- ======================================================
     БОЙ
======================================================= -->

<div id="combatScreen">

    <div class="combatTop">

        <div>
            <div class="enemyTitle" id="enemyName">ВОЛК</div>
            <div class="distance">
                Дистанция: <b id="distance">14</b> м
            </div>
        </div>

        <button
            onclick="leaveCombat()"
            style="
            background:#222;
            border:1px solid #555;
            padding:10px 15px;">
            ОТСТУПИТЬ
        </button>

    </div>

    <div class="enemy">

        <div class="animal" id="animal">🐺</div>

        <div class="enemyHealth">
            <i id="enemyHealth"></i>
        </div>

        <div id="enemyState"
             style="font-size:11px;color:#aeb5b2">
             Наблюдает за вами
        </div>

    </div>

    <div class="combatBottom">

        <div class="combatStats">
            <span>❤ <b id="combatHp">100</b></span>
            <span>⚡ <b id="combatEnergy">100</b></span>
            <span>🔪 Нож</span>
        </div>

        <div class="combatButtons">

            <button class="combatBtn" onclick="attack()">
                ⚔️<br>АТАКА
            </button>

            <button class="combatBtn" onclick="dodge()">
                ↪️<br>УКЛОНЕНИЕ
            </button>

            <button class="combatBtn" onclick="useCombatItem()">
                💊<br>ПРЕДМЕТ
            </button>

            <button class="combatBtn" onclick="leaveCombat()">
                🏃<br>ОТСТУПИТЬ
            </button>

        </div>

    </div>

</div>


<!-- ======================================================
     ОБЩИЕ ОКНА
======================================================= -->

<div id="inventory" class="overlay">

    <div class="panel">

        <div class="panelHeader">
            <h2>РЮКЗАК</h2>
            <button class="close" onclick="closeAll()">×</button>
        </div>

        <div class="panelBody">

            <div class="inventoryGrid" id="inventoryGrid"></div>

        </div>

    </div>

</div>


<div id="genericPanel" class="overlay">

    <div class="panel">

        <div class="panelHeader">
            <h2 id="genericTitle">ОБЪЕКТ</h2>
            <button class="close" onclick="closeAll()">×</button>
        </div>

        <div class="panelBody" id="genericBody"></div>

    </div>

</div>


<div id="eventPanel" class="overlay">

    <div class="panel">

        <div class="panelBody">

            <div class="eventTitle" id="eventTitle"></div>

            <div class="eventText" id="eventText"></div>

            <div class="eventButtons">

                <button onclick="eventAction('search')">
                    ОСМОТРЕТЬ
                </button>

                <button onclick="eventAction('leave')">
                    УЙТИ
                </button>

            </div>

        </div>

    </div>

</div>


<div id="notification"></div>

</div>


<script>
/* =========================================================
   СОСТОЯНИЕ ИГРЫ
========================================================= */

const state = {

    x:50,
    y:50,

    region:"Таинственное озеро",

    hp:100,
    hunger:100,
    thirst:100,
    energy:100,
    warmth:100,

    hour:8,
    minute:0,

    weather:"Ясно",
    temperature:-8,

    moving:false,

    inventory:[
        {name:"Фляга",icon:"🫙",count:1},
        {name:"Консервы",icon:"🥫",count:2},
        {name:"Спички",icon:"🔥",count:12},
        {name:"Нож",icon:"🔪",count:1},
        {name:"Фонарь",icon:"🔦",count:1},
        {name:"Бинт",icon:"🩹",count:2},
        {name:"Удочка",icon:"🎣",count:1},
        {name:"Палка",icon:"🪵",count:3},
        {name:"Книга",icon:"📕",count:1},
        {name:"Шкура",icon:"🟫",count:1}
    ],

    combat:null

};


/* =========================================================
   КАРТА
========================================================= */

const world=document.getElementById("world");

function updateWorld(){

    /*
       Игрок остаётся в центре.
       Карта двигается в противоположную сторону.
    */

    const scale=1;

    const px=(50-state.x)*16*scale;
    const py=(50-state.y)*10.67*scale;

    world.style.transform=
        `translate(calc(-50% + ${px}px),calc(-50% + ${py}px))`;

    detectRegion();

}


/* =========================================================
   ПЕРЕМЕЩЕНИЕ
========================================================= */

function move(dx,dy){

    if(state.combat) return;

    const speed=0.45;

    state.x+=dx*speed;
    state.y+=dy*speed;

    state.x=Math.max(4,Math.min(96,state.x));
    state.y=Math.max(4,Math.min(96,state.y));

    passTime(2);

    state.energy-=0.12;
    state.hunger-=0.025;
    state.thirst-=0.04;

    if(state.warmth<20){
        state.hp-=0.08;
    }

    updateWorld();
    updateHUD();

    randomEncounter();

    saveGame();
}


/* =========================================================
   КЛАВИАТУРА
========================================================= */

document.addEventListener("keydown",e=>{

    if(e.key==="ArrowUp" || e.key.toLowerCase()==="w")
        move(0,-1);

    if(e.key==="ArrowDown" || e.key.toLowerCase()==="s")
        move(0,1);

    if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a")
        move(-1,0);

    if(e.key==="ArrowRight" || e.key.toLowerCase()==="d")
        move(1,0);

    if(e.key==="i")
        openInventory();

});


/* =========================================================
   РЕГИОНЫ
========================================================= */

const regions=[

    {
        name:"Горы Тимбервулф",
        x1:0,y1:0,x2:32,y2:30
    },

    {
        name:"Разломанный перевал",
        x1:32,y1:0,x2:60,y2:25
    },

    {
        name:"Заброшенный аэродром",
        x1:68,y1:0,x2:100,y2:27
    },

    {
        name:"Таинственное озеро",
        x1:34,y1:27,x2:62,y2:58
    },

    {
        name:"Безмолвная речная долина",
        x1:62,y1:27,x2:86,y2:60
    },

    {
        name:"Мрачная бухта",
        x1:10,y1:62,x2:35,y2:100
    },

    {
        name:"Тихая долина",
        x1:28,y1:55,x2:48,y2:78
    },

    {
        name:"Горный город",
        x1:44,y1:58,x2:66,y2:83
    },

    {
        name:"Ясень-каньон",
        x1:65,y1:58,x2:83,y2:85
    },

    {
        name:"Зона заражения",
        x1:80,y1:65,x2:100,y2:100
    }

];

function detectRegion(){

    const r=regions.find(r=>
        state.x>=r.x1 &&
        state.x<=r.x2 &&
        state.y>=r.y1 &&
        state.y<=r.y2
    );

    if(r && r.name!==state.region){

        state.region=r.name;

        notify("ВЫ ПЕРЕШЛИ В РЕГИОН",r.name);

    }

    document.getElementById("locationName")
        .textContent=state.region.toUpperCase();

}


/* =========================================================
   ВРЕМЯ
========================================================= */

function passTime(minutes){

    state.minute+=minutes;

    while(state.minute>=60){

        state.minute-=60;
        state.hour++;

    }

    if(state.hour>=24){

        state.hour=0;

    }

    document.getElementById("clock").textContent=
        String(state.hour).padStart(2,"0")+":"+
        String(state.minute).padStart(2,"0");

}


/* =========================================================
   ПОГОДА
========================================================= */

const weather=[
    ["Ясно",-8],
    ["Пасмурно",-10],
    ["Снег",-13],
    ["Метель",-18],
    ["Туман",-7],
    ["Сильный ветер",-16]
];

function changeWeather(){

    const w=weather[Math.floor(Math.random()*weather.length)];

    state.weather=w[0];
    state.temperature=w[1];

    document.getElementById("weatherText").textContent=
        `${state.weather} · ${state.temperature}°C`;

}

setInterval(()=>{

    if(Math.random()<.22)
        changeWeather();

},30000);


/* =========================================================
   СОСТОЯНИЕ
========================================================= */

function clampStats(){

    state.hp=Math.max(0,Math.min(100,state.hp));
    state.hunger=Math.max(0,Math.min(100,state.hunger));
    state.thirst=Math.max(0,Math.min(100,state.thirst));
    state.energy=Math.max(0,Math.min(100,state.energy));
    state.warmth=Math.max(0,Math.min(100,state.warmth));

}

function updateHUD(){

    clampStats();

    setStat("hp",state.hp);
    setStat("food",state.hunger);
    setStat("water",state.thirst);
    setStat("energy",state.energy);
    setStat("warm",state.warmth);

}

function setStat(id,value){

    document.getElementById(id+"Text")
        .textContent=Math.round(value);

    document.getElementById(id+"Bar")
        .style.width=value+"%";

}


/* =========================================================
   СЛУЧАЙНЫЕ СОБЫТИЯ
========================================================= */

function randomEncounter(){

    if(Math.random()>0.035) return;

    const events=[

        {
            title:"ВОЛК ЗАМЕТИЛ ВАС",
            text:"Впереди между деревьями показалась стая. Один волк отделился от остальных.",
            type:"wolf"
        },

        {
            title:"СЛЕДЫ",
            text:"На снегу видны свежие следы животного. Они уходят в лес.",
            type:"tracks"
        },

        {
            title:"ЗАБРОШЕННЫЙ ЯЩИК",
            text:"У дороги лежит старый деревянный ящик.",
            type:"loot"
        },

        {
            title:"МЕТЕЛЬ НАБИРАЕТ СИЛУ",
            text:"Видимость резко ухудшается. Продолжать движение опасно.",
            type:"storm"
        }

    ];

    const e=events[Math.floor(Math.random()*events.length)];

    document.getElementById("eventTitle").textContent=e.title;
    document.getElementById("eventText").textContent=e.text;

    document.getElementById("eventPanel").dataset.type=e.type;
    document.getElementById("eventPanel").classList.add("open");

}


/* =========================================================
   СОБЫТИЯ
========================================================= */

function eventAction(action){

    const panel=document.getElementById("eventPanel");
    const type=panel.dataset.type;

    panel.classList.remove("open");

    if(action==="leave") return;

    if(type==="wolf"){

        startCombat("Волк","🐺",100,14);

    }

    if(type==="loot"){

        addItem("Консервы","🥫",1);

        notify("НАЙДЕНО","Консервы");

    }

    if(type==="tracks"){

        notify("СЛЕДЫ","Они ещё свежие.");

    }

    if(type==="storm"){

        state.warmth-=10;
        state.energy-=5;

        updateHUD();

    }

}


/* =========================================================
   БОЙ
========================================================= */

function startCombat(name,icon,hp,distance){

    state.combat={
        name,
        icon,
        hp,
        maxHp:hp,
        distance
    };

    document.getElementById("enemyName").textContent=name.toUpperCase();
    document.getElementById("animal").textContent=icon;

    updateCombat();

    document.getElementById("combatScreen")
        .classList.add("open");

    notify("ОПАСНОСТЬ",name.toUpperCase()+" НАПАДАЕТ");

}

function updateCombat(){

    if(!state.combat) return;

    document.getElementById("distance")
        .textContent=Math.round(state.combat.distance);

    document.getElementById("enemyHealth")
        .style.width=
        (state.combat.hp/state.combat.maxHp*100)+"%";

    document.getElementById("combatHp")
        .textContent=Math.round(state.hp);

    document.getElementById("combatEnergy")
        .textContent=Math.round(state.energy);

}

function attack(){

    if(!state.combat) return;

    if(state.energy<8){

        notify("НЕТ СИЛ","Вы слишком устали.");

        return;

    }

    state.energy-=8;

    let damage=15+Math.random()*15;

    if(state.combat.distance>8)
        damage*=.55;

    state.combat.hp-=damage;

    state.combat.distance-=1.5;

    document.getElementById("enemyState")
        .textContent="Ранен";

    updateCombat();
    updateHUD();

    if(state.combat.hp<=0){

        victory();

        return;

    }

    enemyAttack();

}

function dodge(){

    if(!state.combat) return;

    state.energy-=6;

    const success=Math.random()<.65;

    if(success){

        state.combat.distance+=3;

        document.getElementById("enemyState")
            .textContent="Промахнулся!";

        notify("УКЛОНЕНИЕ","Вы избежали атаки.");

    }else{

        state.hp-=10;

        notify("УДАР","Вы получили травму.");

    }

    updateCombat();
    updateHUD();

}

function enemyAttack(){

    setTimeout(()=>{

        if(!state.combat) return;

        const chance=Math.random();

        if(chance<.25){

            state.combat.distance-=2;

            document.getElementById("enemyState")
                .textContent="Волк приближается!";

        }else{

            state.hp-=7+Math.random()*9;

            notify("АТАКА ВОЛКА","Вы получили ранение.");

        }

        updateCombat();
        updateHUD();

        if(state.hp<=0){

            document.getElementById("enemyState")
                .textContent="Вы потеряли сознание.";

        }

    },500);

}

function useCombatItem(){

    const food=state.inventory.find(i=>i.name==="Консервы");

    if(food && food.count>0){

        food.count--;
        state.hunger+=25;
        state.energy+=5;

        notify("ЕДА","Вы съели консервы.");

        updateHUD();

    }else{

        notify("ПУСТО","Подходящих предметов нет.");

    }

}

function victory(){

    const animal=state.combat.name;

    state.combat=null;

    document.getElementById("combatScreen")
        .classList.remove("open");

    addItem("Мясо", "🥩",1);

    notify("ЖИВОТНОЕ ПОБЕЖДЕНО",animal);

}


/* =========================================================
   ЛОКАЦИИ
========================================================= */

let previousLocation=null;

function enterLocation(region,name){

    previousLocation={
        x:state.x,
        y:state.y,
        region:state.region
    };

    document.getElementById("interiorScreen")
        .classList.add("open");

    notify("ЛОКАЦИЯ",name);

}

function exitLocation(){

    document.getElementById("interiorScreen")
        .classList.remove("open");

}


/* =========================================================
   ОСМОТР
========================================================= */

function inspect(title,text){

    document.getElementById("genericTitle")
        .textContent=title;

    document.getElementById("genericBody")
        .innerHTML=`
        <p style="color:#b7bfbc;line-height:1.6">${text}</p>
        <button
            onclick="closeAll()"

            padding:12px 20px;
            background:#222b2e;
            border:1px solid #444">
            ЗАКРЫТЬ
        </button>
        `;

    document.getElementById("genericPanel")
        .classList.add("open");

}


/* =========================================================
   КОНТЕЙНЕРЫ
========================================================= */

function openContainer(name){

    const lootPool=[

        ["Консервы","🥫"],
        ["Спички","🔥"],
        ["Бинт","🩹"],
        ["Вода","🫙"],
        ["Патроны","🔸"],
        ["Шерстяная шапка","🧢"],
        ["Книга","📕"],
        ["Кофе","☕"],
        ["Факел","🕯️"],
        ["Палка","🪵"]

    ];

    const amount=1+Math.floor(Math.random()*3);

    let found=[];

    for(let i=0;i<amount;i++){

        const item=lootPool[
            Math.floor(Math.random()*lootPool.length)
        ];

        found.push(item);

        addItem(item[0],item[1],1);

    }

    document.getElementById("genericTitle")
        .textContent=name.toUpperCase();

    document.getElementById("genericBody")
        .innerHTML=`

        <div style="font-size:13px;color:#adb5b2;margin-bottom:15px">
            Внутри:
        </div>

        ${found.map(x=>`
            <div style="
            display:flex;
            align-items:center;
            gap:12px;
            padding:12px;
            background:#192125;
            margin-bottom:6px">
                <span style="font-size:27px">${x[1]}</span>
                <span>${x[0]}</span>
            </div>
        `).join("")}

        <button
            onclick="closeAll()"
            style="
            width:100%;
            padding:13px;
            margin-top:10px;
            background:#252e32;
            border:1px solid #555">
            ЗАКРЫТЬ
        </button>
        `;

    document.getElementById("genericPanel")
        .classList.add("open");

}


/* =========================================================
   ИНВЕНТАРЬ
========================================================= */

function openInventory(){

    renderInventory();

    document.getElementById("inventory")
        .classList.add("open");

}

function renderInventory(){

    const grid=document.getElementById("inventoryGrid");

    grid.innerHTML=state.inventory.map((item,index)=>`

        <div class="item" onclick="useItem(${index})">

            <div class="itemIcon">${item.icon}</div>

            <div class="itemName">
                ${item.name}
            </div>

            <div class="itemCount">
                ×${item.count}
            </div>

        </div>

    `).join("");

}

function useItem(index){

    const item=state.inventory[index];

    if(!item || item.count<=0) return;

    if(item.name==="Консервы"){

        item.count--;
        state.hunger+=30;

    }

    else if(item.name==="Фляга" || item.name==="Вода"){

        item.count--;
        state.thirst+=35;

    }

    else if(item.name==="Бинт"){

        item.count--;
        state.hp+=25;

    }

    else if(item.name==="Кофе"){

        item.count--;
        state.energy+=20;

    }

    else{

        notify(item.name,"Этот предмет сейчас нельзя использовать.");

        return;

    }

    clampStats();
    updateHUD();
    renderInventory();

}


/* =========================================================
   ДОБАВЛЕНИЕ ПРЕДМЕТОВ
========================================================= */

function addItem(name,icon,count){

    let item=state.inventory.find(i=>i.name===name);

    if(item){

        item.count+=count;

    }else{

        state.inventory.push({
            name,
            icon,
            count
        });

    }

}


/* =========================================================
   КАРТА / ЖУРНАЛ
========================================================= */

/* =========================================================
   УВЕДОМЛЕНИЯ
========================================================= */

let notificationTimer;

function notify(title,text){

    const n=document.getElementById("notification");

    n.innerHTML=
        `<b>${title}</b><br>
        <span style="font-size:11px;color:#adb5b2">${text}</span>`;

    n.classList.add("show");

    clearTimeout(notificationTimer);

    notificationTimer=setTimeout(()=>{
        n.classList.remove("show");
    },2500);

}


/* =========================================================
   СЛУЧАЙНЫЕ ПОВСЕДНЕВНЫЕ ИЗМЕНЕНИЯ
========================================================= */

setInterval(()=>{

    state.hunger-=.15;
    state.thirst-=.25;
    state.energy-=.1;

    if(state.weather==="Метель")
        state.warmth-=.35;
    else
        state.warmth-=.05;

    passTime(5);

    updateHUD();

    saveGame();

},10000);


/* =========================================================
   ЗАКРЫТЬ ОКНА
========================================================= */

function closeAll(){

    document.querySelectorAll(".overlay")
        .forEach(x=>x.classList.remove("open"));

}


/* =========================================================
   СОХРАНЕНИЕ
========================================================= */

function saveGame(){

    localStorage.setItem(
        "sever_survival_save",
        JSON.stringify(state)
    );

}

function loadGame(){

    const save=localStorage.getItem(
        "sever_survival_save"
    );

    if(!save) return;

    try{

        const data=JSON.parse(save);

        Object.assign(state,data);

    }catch(e){}

}


/* =========================================================
   СТАРТ
========================================================= */

loadGame();

updateWorld();
updateHUD();

setTimeout(()=>{

    notify(
        "ВЫЖИВАНИЕ НАЧАЛОСЬ",
        "Исследуйте территорию и найдите укрытие."
    );

},800);


/* =========================================================
   СВАЙПЫ НА ТЕЛЕФОНЕ
========================================================= */

let touchStartX=0;
let touchStartY=0;

document.addEventListener("touchstart",e=>{

    if(e.touches.length!==1) return;

    touchStartX=e.touches[0].clientX;
    touchStartY=e.touches[0].clientY;

},{passive:true});


document.addEventListener("touchend",e=>{

    if(e.changedTouches.length!==1) return;

    const dx=e.changedTouches[0].clientX-touchStartX;
    const dy=e.changedTouches[0].clientY-touchStartY;

    if(Math.max(Math.abs(dx),Math.abs(dy))<35)
        return;

    if(Math.abs(dx)>Math.abs(dy)){

        if(dx>0) move(1,0);
        else move(-1,0);

    }else{

        if(dy>0) move(0,1);
        else move(0,-1);

    }

},{passive:true});

</script>
