<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>The Long Dark — Mystery Lake</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111416;
  color:#ddd;
  font-family:Georgia,"Times New Roman",serif;
}

button{
  font:inherit;
  color:inherit;
  border:0;
  cursor:pointer;
}

#app{
  width:100%;
  height:100%;
  position:relative;
  overflow:hidden;
  background:#111416;
}

/* =========================
   MAIN MENU
========================= */

#menu{
  position:absolute;
  inset:0;
  z-index:50;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 45%,rgba(120,105,80,.25),transparent 38%),
    linear-gradient(#17191a,#353432 55%,#151718);
}

#menu:before{
  content:"";
  position:absolute;
  inset:0;
  opacity:.28;
  background:
    linear-gradient(175deg,transparent 30%,#6d6252 31%,transparent 33%),
    linear-gradient(185deg,transparent 55%,#817765 56%,transparent 59%),
    repeating-linear-gradient(0deg,transparent 0 5px,rgba(255,255,255,.025) 6px);
}

.menu-character{
  position:absolute;
  left:-35px;
  bottom:-30px;
  width:42vw;
  max-width:360px;
  height:52vh;
  min-height:300px;
  background:
    radial-gradient(ellipse at 45% 55%,#6b725f 0 20%,transparent 21%),
    linear-gradient(135deg,#343c36,#151b1b);
  clip-path:polygon(0 20%,35% 8%,65% 35%,90% 100%,0 100%);
  opacity:.75;
}

.menu-character.right{
  left:auto;
  right:-55px;
  transform:scaleX(-1);
  opacity:.38;
}

.menu-content{
  position:relative;
  z-index:2;
  width:min(390px,88vw);
  text-align:center;
  margin-top:-30px;
}

.game-logo{
  font-size:clamp(42px,12vw,78px);
  line-height:.8;
  font-weight:900;
  letter-spacing:-5px;
  color:#c6a84b;
  text-shadow:
    3px 3px #25211b,
    -2px -2px #74623a,
    0 8px 20px #000;
  transform:rotate(-2deg);
  margin-bottom:24px;
}

.logo-sub{
  color:#aaa18b;
  font-size:13px;
  letter-spacing:5px;
  margin-bottom:28px;
}

.menu-button{
  display:block;
  width:100%;
  min-height:65px;
  margin:13px 0;
  padding:10px 20px;
  border-radius:8px;
  border:2px solid #17191a;
  background:
    linear-gradient(#4c4c49,#292b2b 45%,#1d2020);
  box-shadow:
    inset 0 0 0 2px #65615a,
    inset 0 0 20px #111,
    0 5px 0 #101111,
    0 9px 15px rgba(0,0,0,.5);
  color:#c5b35b;
  font-size:29px;
  font-weight:bold;
  text-shadow:2px 2px #171717;
}

.menu-button:hover,
.menu-button:active{
  filter:brightness(1.2);
  transform:translateY(1px);
}

.menu-button.secondary{
  color:#aaa;
}

.menu-version{
  margin-top:22px;
  font-family:monospace;
  font-size:11px;
  color:#777;
}

/* =========================
   GAME
========================= */

#game{
  position:absolute;
  inset:0;
  display:none;
  flex-direction:column;
  background:#101516;
}

.topbar{
  height:72px;
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:
    max(6px,env(safe-area-inset-top))
    10px 5px;
  background:
    linear-gradient(#303435,#1b2021);
  border-bottom:2px solid #090b0b;
  box-shadow:0 2px 10px #000;
  z-index:10;
}

.brand{
  font-weight:bold;
  font-size:16px;
  color:#c7b866;
}

.coords{
  font-family:monospace;
  font-size:11px;
  color:#999;
}

.timebox{
  text-align:right;
  font-family:monospace;
  color:#ddd;
}

.timebox strong{
  color:#c8b95d;
  font-size:15px;
}

/* survival bar */

.survival{
  height:46px;
  min-height:46px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  padding:5px 8px;
  background:#171b1c;
  border-bottom:1px solid #343838;
  z-index:10;
}

.stat{
  position:relative;
  min-width:0;
  padding:4px 6px;
  background:#252a2a;
  border:1px solid #454848;
  border-radius:3px;
  overflow:hidden;
}

.stat-name{
  font-size:9px;
  color:#999;
}

.stat-value{
  font-family:monospace;
  font-size:12px;
}

.stat-fill{
  position:absolute;
  left:0;
  bottom:0;
  height:3px;
  width:50%;
  background:#b7aa57;
}

/* =========================
   MAP
========================= */

.map-wrap{
  position:relative;
  flex:1;
  min-height:0;
  overflow:hidden;
  background:#232826;
}

#mapCanvas{
  display:block;
  width:100%;
  height:100%;
  image-rendering:auto;
  touch-action:none;
}

.location-label{
  position:absolute;
  left:12px;
  top:10px;
  padding:7px 12px;
  background:rgba(18,20,20,.82);
  border-left:4px solid #b6a64e;
  font-size:14px;
  pointer-events:none;
}

.weather-label{
  position:absolute;
  right:10px;
  top:10px;
  padding:6px 9px;
  background:rgba(18,20,20,.75);
  font-size:11px;
  color:#bbb;
  pointer-events:none;
}

.target-label{
  position:absolute;
  left:50%;
  bottom:8px;
  transform:translateX(-50%);
  padding:5px 10px;
  border-radius:4px;
  background:rgba(20,22,22,.86);
  color:#c5bb7a;
  font-size:11px;
  opacity:0;
  transition:.2s;
  pointer-events:none;
}

.target-label.show{
  opacity:1;
}

/* =========================
   DIRECTION CONTROLS
========================= */

.controls{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:5;
}

.arrow{
  position:absolute;
  width:68px;
  height:68px;
  border-radius:5px;
  pointer-events:auto;

  background:
    linear-gradient(#545856,#282c2c 45%,#202323);

  border:2px solid #111;
  box-shadow:
    inset 0 0 0 1px #747875,
    0 3px 6px #000;

  color:#c6c3aa;
  font-family:Arial,sans-serif;
  font-size:38px;
  line-height:1;
  text-shadow:2px 2px #111;
  user-select:none;
  touch-action:none;
}

.arrow:active,
.arrow.active{
  transform:scale(.94);
  background:#66675e;
}

.arrow.up{
  top:18px;
  left:50%;
  transform:translateX(-50%);
}

.arrow.down{
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
}

.arrow.left{
  left:16px;
  top:50%;
  transform:translateY(-50%);
}

.arrow.right{
  right:16px;
  top:50%;
  transform:translateY(-50%);
}

.arrow.up:active,
.arrow.down:active{
  transform:translateX(-50%) scale(.94);
}

.arrow.left:active,
.arrow.right:active{
  transform:translateY(-50%) scale(.94);
}

/* =========================
   BOTTOM BAR
========================= */

.bottom{
  height:86px;
  min-height:86px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  padding:7px 8px max(7px,env(safe-area-inset-bottom));
  background:
    linear-gradient(#292d2d,#151818);
  border-top:2px solid #080909;
  z-index:10;
}

.bottom-btn{
  border:1px solid #4b4e4d;
  border-radius:5px;
  background:#252929;
  font-size:25px;
  color:#aaa;
}

.bottom-btn small{
  display:block;
  font-family:Arial,sans-serif;
  font-size:9px;
  margin-top:2px;
  color:#aaa;
}

.bottom-btn:active{
  background:#4a4d48;
}

/* =========================
   PANELS
========================= */

.overlay{
  position:absolute;
  inset:0;
  z-index:30;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:rgba(0,0,0,.62);
}

.panel{
  width:min(560px,100%);
  max-height:88%;
  overflow:auto;
  background:
    linear-gradient(#303333,#1b1f20);
  border:1px solid #666;
  border-bottom:0;
  border-radius:12px 12px 0 0;
  box-shadow:0 -10px 30px #000;
  padding:16px;
}

.panel h2{
  margin:0 0 12px;
  color:#c8b45a;
  font-size:23px;
}

.close{
  float:right;
  width:38px;
  height:38px;
  border-radius:4px;
  background:#3c4140;
}

.item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:10px 7px;
  border-bottom:1px solid #383c3c;
}

.item-name{
  color:#ddd;
}

.item-info{
  color:#888;
  font-size:11px;
}

.action{
  padding:9px 12px;
  border-radius:4px;
  background:#56584f;
  border:1px solid #777;
}

.action:active{
  background:#77796c;
}

/* =========================
   COMMAND BAR
========================= */

.command{
  position:absolute;
  left:10px;
  right:10px;
  bottom:94px;
  z-index:7;
  display:none;
  background:#181b1b;
  border:1px solid #666;
  border-radius:5px;
  padding:5px;
}

.command input{
  width:100%;
  height:42px;
  background:#252928;
  border:1px solid #555;
  color:#ddd;
  padding:0 10px;
  outline:none;
}

/* =========================
   MESSAGE
========================= */

#message{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:40;
  width:min(420px,85vw);
  padding:15px;
  background:rgba(20,22,22,.94);
  border:1px solid #777;
  border-radius:6px;
  box-shadow:0 10px 35px #000;
  text-align:center;
  display:none;
}

#message h3{
  color:#c9b85a;
  margin:0 0 7px;
}

#message p{
  margin:0;
  color:#ccc;
  font-size:14px;
}

/* =========================
   DESKTOP
========================= */

@media(min-width:800px){

  #game{
    max-width:1200px;
    margin:auto;
    border-left:1px solid #333;
    border-right:1px solid #333;
  }

  .arrow{
    width:76px;
    height:76px;
  }

  .arrow.up{top:25px}
  .arrow.down{bottom:25px}
  .arrow.left{left:25px}
  .arrow.right{right:25px}

  .bottom{
    height:75px;
    min-height:75px;
    padding-bottom:7px;
  }

  .menu-content{
    width:410px;
  }
}
</style>
</head>

<body>

<div id="app">

<!-- =========================
     MENU
========================= -->

<section id="menu">

  <div class="menu-character"></div>
  <div class="menu-character right"></div>

  <div class="menu-content">

    <div class="game-logo">
      THE<br>DARK
    </div>

    <div class="logo-sub">
      MYSTERY LAKE
    </div>

    <button class="menu-button" onclick="newGame()">
      Играть
    </button>

    <button class="menu-button" onclick="continueGame()">
      Продолжить
    </button>

    <button class="menu-button secondary" onclick="openSettings()">
      Настройки
    </button>

    <button class="menu-button secondary" onclick="showAbout()">
      Об игре
    </button>

    <button class="menu-button secondary" onclick="exitGame()">
      Выход
    </button>

    <div class="menu-version">
      SURVIVAL BUILD 0.3 · MYSTERY LAKE
    </div>

  </div>
</section>


<!-- =========================
     GAME
========================= -->

<section id="game">

  <header class="topbar">

    <div>
      <div class="brand">THE LONG DARK</div>
      <div class="coords" id="coords">X: 0 · Y: 0</div>
    </div>

    <div class="timebox">
      <div id="dateText">День 1</div>
      <strong id="clock">08:00</strong>
    </div>

  </header>


  <div class="survival">

    <div class="stat">
      <div class="stat-name">❤️ СОСТОЯНИЕ</div>
      <div class="stat-value" id="health">100</div>
      <div class="stat-fill" id="healthFill"></div>
    </div>

    <div class="stat">
      <div class="stat-name">🍖 ГОЛОД</div>
      <div class="stat-value" id="hunger">100</div>
      <div class="stat-fill" id="hungerFill"></div>
    </div>

    <div class="stat">
      <div class="stat-name">💧 ЖАЖДА</div>
      <div class="stat-value" id="thirst">100</div>
      <div class="stat-fill" id="thirstFill"></div>
    </div>

    <div class="stat">
      <div class="stat-name">⚡ ВЫНОСЛИВОСТЬ</div>
      <div class="stat-value" id="stamina">100</div>
      <div class="stat-fill" id="staminaFill"></div>
    </div>

  </div>


  <main class="map-wrap">

    <canvas id="mapCanvas"></canvas>

    <div class="location-label" id="locationLabel">
      📍 Mystery Lake
    </div>

    <div class="weather-label" id="weatherLabel">
      Ясно · −8°C
    </div>

    <div class="target-label" id="targetLabel">
      Направление задано
    </div>


    <div class="controls">

      <button class="arrow up"
              data-dir="up"
              aria-label="Север">▲</button>

      <button class="arrow left"
              data-dir="left"
              aria-label="Запад">◀</button>

      <button class="arrow right"
              data-dir="right"
              aria-label="Восток">▶</button>

      <button class="arrow down"
              data-dir="down"
              aria-label="Юг">▼</button>

    </div>

    <div class="command">
      <input id="commandInput"
             placeholder="осмотреть, взять, идти, костёр, инвентарь...">
    </div>

  </main>


  <footer class="bottom">

    <button class="bottom-btn" onclick="openInventory()">
      🎒
      <small>РЮКЗАК</small>
    </button>

    <button class="bottom-btn" onclick="inspectPlayer()">
      👁
      <small>ОСМОТР</small>
    </button>

    <button class="bottom-btn" onclick="interact()">
      🔥
      <small>ДЕЙСТВИЕ</small>
    </button>

    <button class="bottom-btn" onclick="openMapInfo()">
      🗺
      <small>КАРТА</small>
    </button>

    <button class="bottom-btn" onclick="saveGame()">
      💾
      <small>СОХРАНИТЬ</small>
    </button>

  </footer>

</section>


<!-- =========================
     PANEL
========================= -->

<div class="overlay" id="panelOverlay" onclick="closePanel(event)">
  <div class="panel" id="panel"></div>
</div>


<div id="message">
  <h3 id="messageTitle"></h3>
  <p id="messageText"></p>
</div>

</div>


<script>
/* ============================================================
   THE LONG DARK — MYSTERY LAKE
   Single-file browser survival prototype
============================================================ */


/* =========================
   CANVAS
========================= */

const canvas = document.getElementById("mapCanvas");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;

function resizeCanvas(){

  const r = canvas.getBoundingClientRect();

  W = Math.max(1,Math.floor(r.width));
  H = Math.max(1,Math.floor(r.height));

  const dpr = Math.min(window.devicePixelRatio || 1,2);

  canvas.width = W*dpr;
  canvas.height = H*dpr;

  ctx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener("resize",resizeCanvas);


/* =========================
   GAME STATE
========================= */

const defaultState = {

  day:1,
  minutes:8*60,

  health:100,
  hunger:100,
  thirst:100,
  stamina:100,
  fatigue:8,

  bodyTemp:-8,
  warmth:0,

  x:520,
  y:430,

  weather:"Ясно",
  wind:2,
  snow:0,

  weight:8,
  maxWeight:30,

  injury:null,

  location:"Mystery Lake",

  inventory:[
    {id:"water",name:"Вода",amount:1,weight:1},
    {id:"matches",name:"Спички",amount:12,weight:.1},
    {id:"torch",name:"Факел",amount:1,weight:.3},
    {id:"knife",name:"Нож",amount:1,weight:.4},
    {id:"bandage",name:"Бинт",amount:2,weight:.1},
    {id:"pain",name:"Обезболивающее",amount:2,weight:.05},
    {id:"jerky",name:"Вяленое мясо",amount:1,weight:.4}
  ],

  discovered:[
    "Крушение",
    "Озеро",
    "Кабина",
    "Лес"
  ],

  fire:{
    active:false,
    fuel:0,
    temp:0
  },

  settings:{
    sound:true,
    animations:true
  }
};

let state = structuredClone(defaultState);

let camera = {
  x:0,
  y:0
};

let target = null;

let keys = {};

let animals = [
  {
    type:"wolf",
    x:770,
    y:355,
    alive:true,
    wander:0
  },
  {
    type:"wolf",
    x:350,
    y:600,
    alive:true,
    wander:0
  },
  {
    type:"rabbit",
    x:620,
    y:520,
    alive:true,
    wander:0
  },
  {
    type:"rabbit",
    x:470,
    y:310,
    alive:true,
    wander:0
  }
];


/* =========================
   WORLD
========================= */

const WORLD_W = 1500;
const WORLD_H = 1000;

const locations = [

  {
    name:"Крушение",
    x:520,
    y:430,
    r:38,
    color:"#777",
    icon:"✈",
    description:"Разбитый самолёт. Здесь можно найти полезные вещи."
  },

  {
    name:"Охотничья хижина",
    x:790,
    y:270,
    r:35,
    color:"#785c40",
    icon:"⌂",
    description:"Небольшая деревянная хижина."
  },

  {
    name:"Кабина у озера",
    x:1030,
    y:610,
    r:32,
    color:"#785c40",
    icon:"⌂",
    description:"Старая кабина. Внутри можно укрыться."
  },

  {
    name:"Железнодорожные пути",
    x:1150,
    y:420,
    r:30,
    color:"#777",
    icon:"═",
    description:"Старые железнодорожные пути."
  },

  {
    name:"Лес",
    x:270,
    y:280,
    r:80,
    color:"#384937",
    icon:"♣",
    description:"Густой хвойный лес."
  },

  {
    name:"Озеро",
    x:820,
    y:690,
    r:180,
    color:"#384d50",
    icon:"≈",
    description:"Замёрзшее озеро Mystery Lake."
  },

  {
    name:"Лагерь",
    x:390,
    y:760,
    r:30,
    color:"#735b40",
    icon:"⌂",
    description:"Небольшое место для временного лагеря."
  }

];


/* =========================
   TERRAIN
========================= */

function terrainAt(x,y){

  /* lake */

  const lakeDx = (x-820)/330;
  const lakeDy = (y-690)/220;

  if(lakeDx*lakeDx + lakeDy*lakeDy < 1){
    return "lake";
  }

  /* forest zones */

  if(
    (x<390 && y<560) ||
    (x<300 && y>620)
  ){
    return "forest";
  }

  /* mountains / steep slopes */

  if(
    x>1050 && y<250 ||
    x<180 && y>720 ||
    (x>1180 && y>600)
  ){
    return "slope";
  }

  /* rocks */

  if(
    (x>600 && x<720 && y>180 && y<280) ||
    (x>250 && x<370 && y>600 && y<680)
  ){
    return "rocks";
  }

  /* trails */

  const trail1 =
    Math.abs(y-(450+0.25*(x-300)))<22;

  const trail2 =
    Math.abs(y-(700-0.45*(x-400)))<20;

  const trail3 =
    Math.abs(x-1040)<18 && y>300 && y<650;

  if(trail1 || trail2 || trail3){
    return "trail";
  }

  return "snow";
}


/* =========================
   CAMERA
========================= */

function updateCamera(){

  camera.x = state.x - W/2;
  camera.y = state.y - H/2;

  camera.x = Math.max(0,Math.min(WORLD_W-W,camera.x));
  camera.y = Math.max(0,Math.min(WORLD_H-H,camera.y));
}


/* =========================
   DRAW WORLD
========================= */

function draw(){

  if(!W || !H)return;

  updateCamera();

  ctx.clearRect(0,0,W,H);

  ctx.save();

  ctx.translate(-camera.x,-camera.y);

  drawGround();
  drawLake();
  drawTrails();
  drawForest();
  drawMountains();
  drawBuildings();
  drawItems();
  drawAnimals();
  drawTarget();
  drawPlayer();

  ctx.restore();

  drawWeatherOverlay();

  requestAnimationFrame(draw);
}


/* =========================
   GROUND
========================= */

function drawGround(){

  ctx.fillStyle="#5d604f";
  ctx.fillRect(0,0,WORLD_W,WORLD_H);

  for(let y=0;y<WORLD_H;y+=28){

    for(let x=0;x<WORLD_W;x+=28){

      const t=terrainAt(x,y);

      if(t==="snow"){
        ctx.fillStyle=(Math.random()>.5)
          ?"rgba(215,216,205,.10)"
          :"rgba(35,40,35,.08)";
      }else if(t==="forest"){
        ctx.fillStyle="rgba(28,49,30,.42)";
      }else if(t==="rocks"){

/* =========================
   TERRAIN MOVEMENT
========================= */

function canMove(x,y){

  if(x<15 || y<15 || x>WORLD_W-15 || y>WORLD_H-15){
    return false;
  }

  const t=terrainAt(x,y);

  if(t==="lake"){
    return false;
  }

  /* buildings themselves are not walls,
     only their immediate center */

  for(const loc of locations){

    if(
      loc.name!=="Озеро" &&
      loc.name!=="Лес"
    ){

      const d=Math.hypot(
        x-loc.x,
        y-loc.y
      );

      if(d<16)return false;
    }
  }

  return true;
}


/* =========================
   MOVEMENT
========================= */

function move(dir){

  let dx=0;
  let dy=0;

  if(dir==="up")dy=-1;
  if(dir==="down")dy=1;
  if(dir==="left")dx=-1;
  if(dir==="right")dx=1;

  if(state.injury==="Перелом ноги"){
    dx*=.28;
    dy*=.28;
  }

  if(state.injury==="Растяжение голеностопа"){
    dx*=.58;
    dy*=.58;
  }

  const terrain=terrainAt(
    state.x,
    state.y
  );

  let speed=2.8;

  if(terrain==="snow")speed=2.4;
  if(terrain==="forest")speed=1.75;
  if(terrain==="rocks")speed=1.35;
  if(terrain==="slope")speed=1.1;
  if(terrain==="trail")speed=3.5;

  if(state.fatigue>75)speed*=.65;
  if(state.weight>state.maxWeight*.8)speed*=.72;

  const nx=state.x+dx*speed;
  const ny=state.y+dy*speed;

  if(!canMove(nx,ny)){

    target=null;
    return;
  }

  state.x=nx;
  state.y=ny;

  state.stamina-=terrain==="slope"?.16:.07;

  if(state.stamina<0){
    state.stamina=0;
    state.fatigue+=.02;
  }

  movementHazard(terrain);

  checkLocation();

  target=null;
}


/* =========================
   REALISTIC TERRAIN HAZARD
========================= */

let hazardTimer=0;

function movementHazard(terrain){

  hazardTimer++;

  if(hazardTimer<35)return;

  hazardTimer=0;

  let risk=0;

  if(terrain==="rocks")risk=.006;
  if(terrain==="slope")risk=.012;
  if(terrain==="snow")risk=.002;

  if(state.fatigue>70)risk*=2.2;

  if(state.weight>state.maxWeight*.85)risk*=1.8;

  if(state.weather==="Метель")risk*=1.7;

  if(state.injury)risk*=1.5;

  if(Math.random()<risk){

    const r=Math.random();

    if(r<.70){

      if(!state.injury){
        state.injury="Растяжение голеностопа";
        showMessage(
          "ТРАВМА",
          "Ты неудачно поставил ногу. Голеностоп подвернулся."
        );
      }

    }else if(r<.94){

      if(!state.injury){
        state.injury="Ушиб ноги";
        state.health-=4;

        showMessage(
          "ПАДЕНИЕ",
          "Ты поскользнулся на неровной поверхности и сильно ударил ногу."
        );
      }

    }else{

      if(!state.injury){

        state.injury="Перелом ноги";
        state.health-=20;

        showMessage(
          "ТЯЖЁЛАЯ ТРАВМА",
          "Ты сорвался на склоне. Нога сломана."
        );
      }
    }
  }
}


/* =========================
   LOCATION
========================= */

function checkLocation(){

  let nearest=null;
  let best=9999;

  locations.forEach(loc=>{

    const d=Math.hypot(
      state.x-loc.x,
      state.y-loc.y
    );

    if(d<loc.r+35 && d<best){
      nearest=loc;
      best=d;
    }
  });

  if(nearest){

    state.location=nearest.name;

    if(
      !state.discovered.includes(nearest.name)
    ){
      state.discovered.push(nearest.name);

      showMessage(
        "НОВОЕ МЕСТО",
        nearest.name
      );
    }

  }else{

    state.location="Mystery Lake";
  }
}


/* =========================
   TARGET MOVEMENT
========================= */

function moveToTarget(){

  if(!target)return;

  const dx=target.x-state.x;
  const dy=target.y-state.y;

  if(Math.hypot(dx,dy)<10){

    target=null;
    return;
  }

  if(Math.abs(dx)>Math.abs(dy)){

    move(dx>0?"right":"left");

  }else{

    move(dy>0?"down":"up");
  }
}

/* =========================
   ARROW CONTROLS
========================= */

document.querySelectorAll(".arrow").forEach(btn=>{

  let timer=null;

  const dir=btn.dataset.dir;

  function start(e){

    e.preventDefault();

    btn.classList.add("active");

    move(dir);

    timer=setInterval(()=>{
      move(dir);
    },45);
  }

  function stop(e){

    if(e)e.preventDefault();

    btn.classList.remove("active");

    if(timer){
      clearInterval(timer);
      timer=null;
    }
  }

  btn.addEventListener("pointerdown",start);
  btn.addEventListener("pointerup",stop);
  btn.addEventListener("pointercancel",stop);
  btn.addEventListener("pointerleave",e=>{
    if(timer)stop(e);
  });
});

window.addEventListener("keydown",e=>{

/* =========================
   TIME / SURVIVAL
========================= */

let survivalAccumulator=0;

function gameTick(){

  if(
    document.getElementById("game").style.display!=="flex"
  ){
    return;
  }

  state.minutes+=2;

  if(state.minutes>=1440){

    state.minutes-=1440;
    state.day++;
  }

  /* hunger */

  state.hunger-=.025;

  /* thirst */

  state.thirst-=.045;

  /* fatigue */

  state.fatigue+=.018;

  /* stamina */

  if(state.fatigue<65){
    state.stamina+=.04;
  }

  if(state.stamina>100)state.stamina=100;

  /* cold */

  const outside=
    state.bodyTemp;

  let coldDamage=0;

  if(
    state.bodyTemp<
    -10
  ){
    coldDamage=.015;
  }

  if(state.weather==="Метель"){
    coldDamage*=2.5;
  }

  if(
    state.fire.active &&
    Math.hypot(
      state.x- state.fire.x,
      state.y- state.fire.y
    )<100
  ){
    coldDamage=0;
  }

  state.health-=coldDamage;

  /* starvation */

  if(state.hunger<=0){
    state.health-=.025;
  }

  /* dehydration */

  if(state.thirst<=0){
    state.health-=.045;
  }

  /* limits */

  state.hunger=Math.max(0,Math.min(100,state.hunger));
  state.thirst=Math.max(0,Math.min(100,state.thirst));
  state.stamina=Math.max(0,Math.min(100,state.stamina));
  state.fatigue=Math.max(0,Math.min(100,state.fatigue));
  state.health=Math.max(0,Math.min(100,state.health));

  weatherTick();
  animalTick();
  fireTick();

  updateUI();

  if(state.health<=0){

    gameOver();
  }
}

setInterval(gameTick,1000);


/* =========================
   WEATHER
========================= */

let weatherTimer=0;

function weatherTick(){

  weatherTimer++;

  if(weatherTimer<90)return;

  weatherTimer=0;

  const r=Math.random();

  if(r<.55){

    state.weather="Ясно";
    state.bodyTemp=-7-Math.random()*5;
    state.wind=1+Math.floor(Math.random()*3);

  }else if(r<.78){

    state.weather="Снег";
    state.bodyTemp=-10-Math.random()*5;
    state.wind=3;

  }else if(r<.93){

    state.weather="Туман";
    state.bodyTemp=-8;
    state.wind=2;

  }else{

    state.weather="Метель";
    state.bodyTemp=-16-Math.random()*8;
    state.wind=7;
  }
}


/* =========================
   ANIMALS
========================= */

function animalTick(){

  animals.forEach(a=>{

    if(!a.alive)return;

    a.wander++;

    if(a.wander<12)return;

    a.wander=0;

    const angle=Math.random()*Math.PI*2;

    const speed=
      a.type==="wolf"?7:4;

    const nx=
      a.x+Math.cos(angle)*speed;

    const ny=
      a.y+Math.sin(angle)*speed;

    if(
      nx>30 &&
      ny>30 &&
      nx<WORLD_W-30 &&
      ny<WORLD_H-30 &&
      terrainAt(nx,ny)!=="lake"
    ){
      a.x=nx;
      a.y=ny;
    }

    /* wolf danger */

    if(a.type==="wolf"){

      const d=Math.hypot(
        a.x-state.x,
        a.y-state.y
      );

      if(d<55){

        if(Math.random()<.05){

          state.health-=8;

          showMessage(
            "ВОЛК",
            "Волк бросился на тебя. Ты получил ранение."
          );
        }
      }
    }
  });
}


/* =========================
   FIRE
========================= */

function fireTick(){

  if(!state.fire.active)return;

  state.fire.fuel-=.04;

  state.fire.temp=state.fire.fuel*2;

  if(state.fire.fuel<=0){

    state.fire.active=false;
    state.fire.fuel=0;
  }

  if(
    state.fire.active &&
    Math.hypot(
      state.x-state.fire.x,
      state.y-state.fire.y
    )<100
  ){

    state.bodyTemp=
      Math.min(
        state.bodyTemp+1.2,
        5
      );
  }
}

/* =========================
   INVENTORY
========================= */

function openInventory(){

  let html=`
    <button class="close" onclick="closePanel()">×</button>
    <h2>🎒 РЮКЗАК</h2>
    <div class="item-info">
      Вес: ${state.weight.toFixed(1)} / ${state.maxWeight} кг
    </div>
  `;

  state.inventory.forEach((item,index)=>{

    html+=`
      <div class="item">

        <div>
          <div class="item-name">
            ${item.name}
          </div>

          <div class="item-info">
            Количество: ${item.amount}
            · ${item.weight} кг
          </div>
        </div>

        <button
          class="action"
          onclick="useItem(${index})">
          Использовать
        </button>

      </div>
    `;
  });

  openPanel(html);
}


function useItem(index){

  const item=state.inventory[index];

  if(!item)return;

  if(item.id==="water"){

    state.thirst=
      Math.min(100,state.thirst+30);

    removeItem(index);

    showMessage(
      "ВОДА",
      "Ты выпил воду."
    );

  }else if(item.id==="jerky"){

    state.hunger=
      Math.min(100,state.hunger+25);

    removeItem(index);

    showMessage(
      "ЕДА",
      "Ты съел вяленое мясо."
    );

  }else if(item.id==="bandage"){

    if(state.injury){

      state.injury=null;
      removeItem(index);

      showMessage(
        "МЕДИЦИНА",
        "Ты обработал травму."
      );

    }else{

      showMessage(
        "БИНТ",
        "Сейчас бинт не требуется."
      );
    }

  }else if(item.id==="pain"){

    if(
      state.injury==="Растяжение голеностопа"
    ){

      state.injury=null;
      removeItem(index);

      showMessage(
        "ОБЕЗБОЛИВАЮЩЕЕ",
        "Боль временно уменьшилась."
      );

    }else{

      showMessage(
        "ОБЕЗБОЛИВАЮЩЕЕ",
        "Сейчас это не поможет."
      );
    }

  }else{

    showMessage(
      item.name,
      "Этот предмет пока нельзя использовать здесь."
    );
  }

  updateWeight();
  updateUI();
}


/* =========================
   REMOVE ITEM
========================= */

function removeItem(index){

  const item=state.inventory[index];

  if(item.amount>1){

    item.amount--;

  }else{

    state.inventory.splice(index,1);
  }
}


/* =========================
   WEIGHT
========================= */

function updateWeight(){

  state.weight=
    state.inventory.reduce(
      (sum,item)=>
        sum+item.weight*item.amount,
      0
    );
}

/* =========================
   INTERACTION
========================= */

function interact(){

  let nearest=null;
  let best=70;

  locations.forEach(loc=>{

    const d=Math.hypot(
      state.x-loc.x,
      state.y-loc.y
    );

    if(d<best){

      best=d;
      nearest=loc;
    }
  });

  if(nearest){

    showMessage(
      nearest.name,
      nearest.description+
      "<br><br>Здесь можно исследовать местность."
    );

    return;
  }

  const nearbyAnimal=
    animals.find(a=>
      a.alive &&
      Math.hypot(
        a.x-state.x,
        a.y-state.y
      )<80
    );

  if(nearbyAnimal){

    showMessage(
      "СЛЕДЫ",
      nearbyAnimal.type==="wolf"
        ? "Недалеко находится волк."
        : "Ты заметил кролика."
    );

    return;
  }

  showMessage(
    "ОКРЕСТНОСТИ",
    `Местность: ${terrainAt(state.x,state.y)}.<br>
     Здесь пока ничего интересного не найдено.`
  );
}


/* =========================
   FIRE ACTION
========================= */

function makeFire(){

  const matches=
    state.inventory.find(i=>i.id==="matches");

  if(!matches || matches.amount<=0){

    showMessage(
      "КОСТЁР",
      "Нет спичек."
    );

    return;
  }

  if(state.fire.active){

    state.fire.fuel+=30;

    showMessage(
      "КОСТЁР",
      "Ты добавил топливо."
    );

    return;
  }

  matches.amount--;

  state.fire={
    active:true,
    fuel:45,
    temp:30,
    x:state.x,
    y:state.y
  };

  showMessage(
    "КОСТЁР",
    "Костёр разгорелся."
  );
}

/* =========================

========================= */

function toggleSetting(key){

  state.settings[key]=
    !state.settings[key];

  openSettings();
}


/* =========================
   PANEL
========================= */

function openPanel(html){

  document.getElementById("panel").innerHTML=html;

  document.getElementById("panelOverlay").style.display=
    "flex";
}


function closePanel(e){

  if(
    e &&
    e.target!==document.getElementById("panelOverlay")
  ){
    return;
  }

  document.getElementById("panelOverlay").style.display=
    "none";
}


/* =========================
   MESSAGE
========================= */

let messageTimer=null;

function showMessage(title,text){

  const box=
    document.getElementById("message");

  document.getElementById("messageTitle")
    .textContent=title;

  document.getElementById("messageText")
    .innerHTML=text;

  box.style.display="block";

  clearTimeout(messageTimer);

  messageTimer=setTimeout(()=>{
    box.style.display="none";
  },3000);
}


/* =========================
   SAVE
========================= */

function saveGame(){

  updateWeight();

  localStorage.setItem(
    "TLD_MYSTERY_LAKE_SAVE",
    JSON.stringify(state)
  );

  showMessage(
    "СОХРАНЕНИЕ",
    "Игра сохранена."
  );
}


/* =========================
   LOAD
========================= */

function loadGame(){

  const saved=
    localStorage.getItem(
      "TLD_MYSTERY_LAKE_SAVE"
    );

  if(!saved)return false;

  try{

    state=
      Object.assign(
        structuredClone(defaultState),
        JSON.parse(saved)
      );

    updateWeight();

    return true;

  }catch(e){

    console.error(e);
    return false;
  }
}


/* =========================
   NEW GAME
========================= */

function newGame(){

  state=structuredClone(defaultState);

  target=null;

  document.getElementById("menu").style.display="none";

  document.getElementById("game").style.display="flex";

  resizeCanvas();

  updateUI();

  showMessage(
    "MYSTERY LAKE",
    "Ты очнулся среди заснеженной дикой местности.<br><br>Выживай."
  );
}


/* =========================
   CONTINUE
========================= */

function continueGame(){

  if(loadGame()){

    document.getElementById("menu").style.display="none";

    document.getElementById("game").style.display="flex";

    resizeCanvas();

    updateUI();

    showMessage(
      "ПРОДОЛЖЕНИЕ",
      `День ${state.day}, ${formatTime()}.`
    );

  }else{

    showMessage(
      "НЕТ СОХРАНЕНИЯ",
      "Сохранение не найдено. Начни новую игру."
    );
  }
}


/* =========================
   FORMAT TIME
========================= */

function formatTime(){

  const h=
    Math.floor(state.minutes/60)
      .toString()
      .padStart(2,"0");

  const m=
    (state.minutes%60)
      .toString()
      .padStart(2,"0");

  return `${h}:${m}`;
}

/* =========================
   COMMAND SYSTEM
========================= */

const commandInput=
  document.getElementById("commandInput");

commandInput.addEventListener("keydown",e=>{

  if(e.key!=="Enter")return;

  const text=
    commandInput.value
      .trim()
      .toLowerCase();

  commandInput.value="";

  if(!text)return;

  command(text);
});


function command(text){

  if(
    text.includes("инвентарь") ||
    text.includes("рюкзак")
  ){

    openInventory();
    return;
  }

  if(
    text.includes("осмотреть") ||
    text.includes("осмотр")
  ){

    interact();
    return;
  }

  if(
    text.includes("костер") ||
    text.includes("костёр")
  ){

    makeFire();
    return;
  }

  if(
    text.includes("сохран")
  ){

    saveGame();
    return;
  }

  if(text.includes("север")){

    move("up");
    return;
  }

  if(text.includes("юг")){

    move("down");
    return;
  }

  if(text.includes("запад")){

    move("left");
    return;
  }

  if(text.includes("восток")){

    move("right");
    return;
  }

  showMessage(
    "КОМАНДА",
    "Не удалось понять команду."
  );
}
